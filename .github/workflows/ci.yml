name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run trufflehog (verified secrets only)
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          # Lob is excluded, and only Lob. Its detector matches long base64-ish
          # strings and "verifies" them, which flagged 7 findings in our test
          # files — a test *method name* in notifications/tests.py and PKCE
          # base64 fixtures in gcal/tests.py. This project has no Lob dependency
          # (it is a direct-mail API), so the detector can only ever produce
          # false positives here. Every other detector stays on: with this one
          # excluded the full-history scan reports 0 verified secrets, so
          # nothing real is being masked.
          extra_args: --only-verified --exclude-detectors=lob

  backend:
    name: backend (checks + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lifepilot
          POSTGRES_USER: lifepilot
          POSTGRES_PASSWORD: lifepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: lifepilot
      DB_USER: lifepilot
      DB_PASSWORD: lifepilot
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system checks (production)
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-only-not-a-real-secret-padded-to-fifty-plus-chars-0123456789"
          DJANGO_ALLOWED_HOSTS: "example.com"
        run: python manage.py check --deploy --fail-level ERROR
      - name: Run tests
        run: python manage.py test

  mobile:
    name: mobile (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
