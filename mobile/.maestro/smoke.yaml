appId: com.lifepilot.ai
name: LifePilot AI — smoke (launch → onboarding → login)
tags:
  - smoke
---
# Fast, offline-safe check: the native build boots, the design system renders,
# onboarding pages through, and the auth entry screen loads. No Clerk sign-up,
# no backend required — good for a quick "is it alive" gate.

- launchApp:
    clearState: true

# Splash resolves to onboarding once Clerk finishes loading (auto-waits).
- assertVisible: "Your AI Assistant for Everyday Life."
- takeScreenshot: 01-onboarding

- runFlow: subflows/onboarding.yaml

# Landed on the login screen.
- assertVisible: "Welcome to LifePilot"
- assertVisible: "Continue with Apple"
- assertVisible: "Continue with Google"
- assertVisible: "Continue with Microsoft"
- assertVisible: "Create an account"
- takeScreenshot: 02-login
