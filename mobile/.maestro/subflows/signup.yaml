appId: com.lifepilot.ai
name: sign-up (email + code verification)
---
# Login → Create account → email-code verification. Uses the unique
# ${output.email} generated by the parent flow and the Clerk test code ${CODE}.

- assertVisible: "Welcome to LifePilot"
- tapOn: "Create an account"

- assertVisible: "Create your account"
- tapOn: "Email"
- inputText: ${output.email}
- tapOn: "Password (8+ characters)"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Create account"

# Clerk moves the form into verification mode.
- assertVisible: "Check your email"
- tapOn: "123456" # the code field (placeholder shown as its label)
- inputText: ${CODE}
- hideKeyboard
- tapOn: "Verify"

# setActive → redirect to the tab shell. BiometricGate passes through on devices
# without enrolled biometrics (emulators); on a real device an enrolled user gets
# a native Face ID / Touch ID prompt that Maestro cannot script — see README.
- extendedWaitUntil:
    visible: "Tasks"
    timeout: 20000
